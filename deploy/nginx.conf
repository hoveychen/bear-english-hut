# 静态站点。muvee 约定容器内监听 8080，TLS 由 Traefik 终结——
# 不要在这里开 HTTPS。

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik 在前面，真实客户端 IP 从转发头取
    real_ip_header X-Forwarded-For;

    # 单页应用：所有未命中的路径回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 音频是本应用体积的大头（132 个文件，4.4MB），而且内容一旦生成就不变。
    # 文件名由台词文本派生，换了台词就是新文件名，所以可以放心长缓存。
    location /audio/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Vite 产物带内容哈希，同理可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 绝不能缓存：它是拿到新版本 assets 哈希的唯一入口
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # manifest.json 同理——改了台词要能立刻生效，否则孩子听到的还是旧音频表
    location = /audio/manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # mp3 已经是压缩格式，再 gzip 一遍只费 CPU 不省流量，故不列入

    # 给 muvee 的健康检查一个不触发 SPA 回退的固定端点
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
